      type: object
      additionalProperties: false
      description: Five-band temporal correlation matrix derived locally from the rendered spectrogram. Correlation describes co-variation, not causation or source identity.
      properties:
        status:
          type: string
          enum: [sufficient, insufficient_frames, silent, static]
        frameCount:
          type: integer
          minimum: 0
          maximum: 120
        bandLabels:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
            maxLength: 32
        correlationMatrix:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: array
            minItems: 5
            maxItems: 5
            items:
              type: number
              minimum: -1
              maximum: 1
        principalDirection:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: number
            minimum: -1
            maximum: 1
        principalVarianceShare:
          type: [number, "null"]
          minimum: 0
          maximum: 1
      required:
        - status
        - frameCount
        - bandLabels
        - correlationMatrix
        - principalDirection
        - principalVarianceShare
